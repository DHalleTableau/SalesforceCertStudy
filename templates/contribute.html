<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Suggest a Study Resource</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
    label { display: block; margin: 0.3rem 0; }
    input[type="text"], input[type="url"], select, textarea { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    .confirm { background: #e6f4ea; padding: 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Suggest a Study Resource</h1>
  <p>
    Found a study guide, sample questions, or another useful page for
    a cert? Submit it here and the admin will review it before adding
    it to the app.
  </p>

  {% if submitted %}
  <p class="confirm">Thanks! Your submission has been sent for review.</p>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    <label for="cert_code">Certification</label>
    <select id="cert_code" name="cert_code" required>
      {% for cert in certs %}
      <option value="{{ cert.cert_code }}">{{ cert.name }}</option>
      {% endfor %}
    </select>

    <label for="url">Link (optional)</label>
    <input type="url" id="url" name="url" placeholder="https://...">

    <label for="file">Or upload a file (optional)</label>
    <input type="file" id="file" name="file">

    <label for="note">Anything else the admin should know? (optional)</label>
    <textarea id="note" name="note" rows="3"></textarea>

    <label for="contributor_name">Your name (optional)</label>
    <input type="text" id="contributor_name" name="contributor_name">

    <p></p>
    <button type="submit">Submit</button>
  </form>

  <p><a href="{{ url_for('session_setup') }}">&larr; Back to session setup</a></p>
</body>
</html>
