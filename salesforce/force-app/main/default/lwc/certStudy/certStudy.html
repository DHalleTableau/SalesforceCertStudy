<template>
    <div class="brand-banner">
        <div>
            <div class="brand-title">Salesforce Certification Practice</div>
            <div class="brand-sub">Practice and mock exams with explanations</div>
        </div>
        <div class="brand-chips">
            <span class="brand-chip">Pilot</span>
            <span class="brand-chip">{appVersion}</span>
            <button type="button" class="brand-chip brand-chip_link" onclick={showWhatsNew}>What's new</button>
        </div>
    </div>
    <lightning-card title="Cert Study" icon-name="standard:education">
        <div slot="actions">
            <template lwc:if={showRecsButton}>
                <lightning-button label="Suggest next certs" icon-name="utility:magicwand" onclick={showRecs}
                    class="slds-m-right_x-small"></lightning-button>
            </template>
            <template lwc:if={showHistoryButton}>
                <lightning-button label="My progress" icon-name="utility:trending" onclick={showHistory}
                    class="slds-m-right_x-small"></lightning-button>
            </template>
            <template lwc:if={inPractice}>
                <lightning-button-group>
                    <lightning-button label="Summary" onclick={showSummary} disabled={busy}></lightning-button>
                    <lightning-button label="End session" onclick={endSession} disabled={busy}></lightning-button>
                </lightning-button-group>
            </template>
            <template lwc:if={inTest}>
                <lightning-button-group>
                    <template lwc:if={isPaused}>
                        <lightning-button label="Resume" variant="brand" onclick={resume} disabled={busy}></lightning-button>
                    </template>
                    <template lwc:else>
                        <lightning-button label="Pause" onclick={pause} disabled={busy}></lightning-button>
                    </template>
                    <lightning-button label="End test" onclick={confirmEndTest} disabled={busy}></lightning-button>
                </lightning-button-group>
            </template>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    {error}
                </div>
            </template>

            <!-- loading -->
            <template lwc:if={isLoading}>
                <div class="spinner-holder"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
            </template>

            <!-- choose certifications -->
            <template lwc:if={isSelect}>
                <lightning-radio-group name="mode" label="Mode" options={modeOptions} value={mode}
                    onchange={handleMode} class="slds-m-bottom_small"></lightning-radio-group>
                <template lwc:if={isTestMode}>
                    <lightning-radio-group name="timer" label="Would you like a strict timer or open time?"
                        options={timerOptions} value={timerChoice} onchange={handleTimer}
                        class="slds-m-bottom_x-small"></lightning-radio-group>
                    <p class="slds-text-color_weak slds-m-bottom_small">
                        Either way you can pause and return later — the current question is hidden while paused,
                        and the clock only runs while a question is on screen.
                    </p>
                </template>
                <p class="slds-text-body_regular slds-m-bottom_small">{selectHelp}</p>
                <lightning-input type="search" label="Search certifications" value={filterText}
                    onchange={handleFilter} class="slds-m-bottom_x-small"></lightning-input>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_x-small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="area" label="Product area" value={areaFilter}
                            options={areaFilterOptions} onchange={handleAreaFilter}></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="type" label="Type" value={typeFilter}
                            options={typeFilterOptions} onchange={handleTypeFilter}></lightning-combobox>
                    </div>
                </div>
                <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                    <div class="slds-col">
                        <lightning-input type="checkbox" label="Hide retiring exams" checked={hideRetiring}
                            onchange={handleHideRetiring}></lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input type="checkbox" label={hideEarnedLabel} checked={hideEarned}
                            onchange={handleHideEarned}></lightning-input>
                    </div>
                </div>
                <template lwc:if={selectedCount}>
                    <div class="slds-m-bottom_small">
                        <template for:each={selectedCerts} for:item="c">
                            <lightning-pill key={c.code} label={c.name} name={c.code} onremove={removeCert}
                                class="slds-m-right_xx-small"></lightning-pill>
                        </template>
                    </div>
                </template>
                <div class="cert-list slds-box slds-box_x-small">
                    <template for:each={filteredCerts} for:item="c">
                        <div key={c.code} class="cert-row">
                            <div class="cert-line">
                                <lightning-input type="checkbox" label={c.label} data-code={c.code}
                                    checked={c.checked} onchange={toggleCert}></lightning-input>
                                <template lwc:if={c.hasPrereqs}>
                                    <span class="prereq-inline">({c.prereqNote})</span>
                                </template>
                                <lightning-button variant="base" class="earned-btn" label={c.earnedLabel}
                                    icon-name={c.earnedIcon} data-code={c.code} onclick={toggleEarned}
                                    title="Mark certifications you already hold so they can be hidden from the list"></lightning-button>
                            </div>
                            <template lwc:if={c.isFlagged}>
                                <div class="retiring-note">{c.statusNote}</div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="slds-m-top_small">
                    <lightning-button variant="brand" label={startLabel} onclick={start}
                        disabled={noneSelected}></lightning-button>
                </div>
                <div class="contrib-strip">
                    <lightning-button variant="base" label="Share a study resource" icon-name="utility:link"
                        data-kind="Study resource" onclick={openContribute} class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="base" label="Suggest an improvement" icon-name="utility:light_bulb"
                        data-kind="Suggestion" onclick={openContribute}></lightning-button>
                </div>
            </template>

            <!-- prerequisite question -->
            <template lwc:if={isPrereq}>
                <div class="slds-box slds-theme_shade">
                    <p class="slds-text-heading_small slds-m-bottom_x-small">{pending.certName}</p>
                    <p class="slds-m-bottom_small">
                        This certification has prerequisites: {pending.prereqs}.
                        Include questions on those prerequisites too?
                    </p>
                    <lightning-button variant="brand" label="Yes, include them" onclick={answerPrereqYes}
                        disabled={busy} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="No, just this one" onclick={answerPrereqNo} disabled={busy}></lightning-button>
                </div>
            </template>

            <!-- session header -->
            <template lwc:if={inSession}>
                <div class="slds-grid slds-wrap slds-grid_align-spread slds-m-bottom_small session-bar">
                    <div class="slds-text-color_weak slds-truncate" title={sessionCertNames}>{sessionCertNames}</div>
                    <div class="slds-text-title_bold">
                        {scoreText}
                        <template lwc:if={inTest}>
                            <span class="slds-m-left_medium"><span class={timerClass}>{timerText}</span></span>
                        </template>
                    </div>
                </div>
            </template>

            <!-- paused test: question hidden -->
            <template lwc:if={isPaused}>
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_large">
                    <p class="slds-text-heading_medium slds-m-bottom_x-small">Test paused</p>
                    <p class="slds-m-bottom_medium">The clock is stopped and your question is hidden. Pick up whenever you're ready.</p>
                    <lightning-button variant="brand" label="Resume test" onclick={resume} disabled={busy}></lightning-button>
                </div>
            </template>

            <!-- question -->
            <template lwc:if={isQuestion}>
                <div class="slds-text-title slds-m-bottom_x-small">Question {question.questionNumber} · {questionMeta}</div>
                <p class="stem slds-m-bottom_medium">{question.stem}</p>
                <div role="group" aria-label="Answer options">
                    <template for:each={questionOptions} for:item="o">
                        <button key={o.key} class={o.cls} data-key={o.key} onclick={selectOption} type="button">
                            <span class="option-key">{o.key}</span>
                            <span class="option-text">{o.text}</span>
                        </button>
                    </template>
                </div>
                <div class="slds-grid slds-grid_vertical-align-center slds-m-top_small">
                    <lightning-button variant="brand" label={submitLabel} onclick={submit}
                        disabled={submitDisabled}></lightning-button>
                    <span class="slds-m-left_small slds-text-color_weak">{chooseText} Tip: press A–E, then Enter.</span>
                </div>
                <div class="slds-m-top_small">
                    <template lwc:if={showReportLink}>
                        <lightning-button variant="base" label="Report a problem with this question"
                            icon-name="utility:flag" onclick={openReport}></lightning-button>
                    </template>
                    <template lwc:if={reportAlreadySent}>
                        <span class="slds-text-color_weak">Thanks, your report was sent.</span>
                    </template>
                    <template lwc:if={showReportForm}>
                        <div class="report-box">
                            <lightning-combobox name="reportType" label="What is the problem?" value={reportType}
                                options={reportTypeOptions} placeholder="Choose a type" onchange={changeReportType}
                                required></lightning-combobox>
                            <lightning-textarea name="reportComment" label="Details (optional unless Other)"
                                value={reportComment} maxlength="2000" onchange={changeReportComment}
                                required={reportCommentRequired}></lightning-textarea>
                            <template lwc:if={reportError}>
                                <p class="slds-text-color_error slds-m-top_x-small">{reportError}</p>
                            </template>
                            <div class="slds-m-top_x-small">
                                <lightning-button variant="brand" label="Send report" onclick={sendReport}
                                    disabled={reportSendDisabled} class="slds-m-right_x-small"></lightning-button>
                                <lightning-button label="Cancel" onclick={cancelReport}></lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- feedback: stays on screen until Next -->
            <template lwc:if={isFeedback}>
                <div class={verdictClass}>
                    <p class="slds-text-heading_small">{verdictText}</p>
                </div>
                <div class="slds-text-title slds-m-bottom_x-small">{gradedMeta}</div>
                <p class="stem slds-m-bottom_medium">{gradedStem}</p>
                <template for:each={feedbackOptions} for:item="o">
                    <div key={o.key} class={o.cls}>
                        <div class="slds-grid slds-grid_vertical-align-start">
                            <span class="option-key">{o.key}</span>
                            <div class="slds-col">
                                <div class="option-text">
                                    {o.text}
                                    <template lwc:if={o.badge}>
                                        <span class="slds-badge slds-m-left_x-small">{o.badge}</span>
                                    </template>
                                </div>
                                <template lwc:if={o.explanation}>
                                    <p class="explanation slds-m-top_xx-small">{o.explanation}</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                <template lwc:if={grade.rawFeedback}>
                    <p class="explanation slds-m-top_small">{grade.rawFeedback}</p>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" label="Next question" onclick={next} disabled={busy}></lightning-button>
                    <span class="slds-m-left_small slds-text-color_weak">or press Enter</span>
                </div>
                <div class="slds-m-top_small">
                    <template lwc:if={showReportLink}>
                        <lightning-button variant="base" label="Report a problem with this question"
                            icon-name="utility:flag" onclick={openReport}></lightning-button>
                    </template>
                    <template lwc:if={reportAlreadySent}>
                        <span class="slds-text-color_weak">Thanks, your report was sent.</span>
                    </template>
                    <template lwc:if={showReportForm}>
                        <div class="report-box">
                            <lightning-combobox name="reportType" label="What is the problem?" value={reportType}
                                options={reportTypeOptions} placeholder="Choose a type" onchange={changeReportType}
                                required></lightning-combobox>
                            <lightning-textarea name="reportComment" label="Details (optional unless Other)"
                                value={reportComment} maxlength="2000" onchange={changeReportComment}
                                required={reportCommentRequired}></lightning-textarea>
                            <template lwc:if={reportError}>
                                <p class="slds-text-color_error slds-m-top_x-small">{reportError}</p>
                            </template>
                            <div class="slds-m-top_x-small">
                                <lightning-button variant="brand" label="Send report" onclick={sendReport}
                                    disabled={reportSendDisabled} class="slds-m-right_x-small"></lightning-button>
                                <lightning-button label="Cancel" onclick={cancelReport}></lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- waiting for generation -->
            <template lwc:if={isWaiting}>
                <template lwc:if={overviewCerts.length}>
                    <ul class="slds-m-bottom_medium">
                        <template for:each={overviewCerts} for:item="c">
                            <li key={c.name} class="slds-m-bottom_x-small">
                                <strong>{c.name}</strong> — {c.examLine}
                                <template lwc:if={c.domains}>
                                    <div class="slds-text-color_weak">{c.domains}</div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:if={pollGaveUp}>
                    <p class="slds-m-bottom_small">Questions are taking longer than usual to generate.</p>
                    <lightning-button label="Check again" onclick={retryPolling}></lightning-button>
                </template>
                <template lwc:else>
                    <div class="waiting">
                        <lightning-spinner alternative-text="Generating" size="small"></lightning-spinner>
                        <p class="slds-m-left_x-large">
                            Generating your next question — usually under a minute…
                            <template lwc:if={inTest}> The test clock is stopped while you wait.</template>
                        </p>
                    </div>
                </template>
            </template>

            <!-- summary -->
            <template lwc:if={isSummary}>
                <p class="slds-text-heading_medium slds-m-bottom_small">{summaryScoreText}</p>
                <template lwc:if={hasAreas}>
                    <p class="slds-text-title_caps slds-m-bottom_x-small">By area (weakest first)</p>
                    <template for:each={summary.areas} for:item="a">
                        <div key={a.key} class="area slds-m-bottom_x-small">
                            <div class="slds-grid slds-grid_align-spread">
                                <span>{a.label}</span>
                                <span class="slds-text-title_bold">{a.pct}% ({a.correct}/{a.total})</span>
                            </div>
                            <div class="bar"><div class="bar-fill" style={a.barStyle}></div></div>
                        </div>
                    </template>
                </template>
                <template lwc:if={hasMissed}>
                    <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Questions to review</p>
                    <template for:each={summary.missed} for:item="m">
                        <details key={m.key} class="missed slds-m-bottom_x-small">
                            <summary>{m.stem}</summary>
                            <p class="slds-m-top_x-small"><strong>Correct:</strong> {m.correctAnswer}</p>
                            <p><strong>You chose:</strong> {m.yourAnswer}</p>
                            <template for:each={m.feedbackBlocks} for:item="b">
                                <p key={b.key} class="explanation slds-m-top_x-small">{b.text}</p>
                            </template>
                        </details>
                    </template>
                </template>
                <template lwc:if={hasSummaryLinks}>
                    <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Keep studying on Trailhead</p>
                    <ul class="study-links">
                        <template for:each={summary.studyLinks} for:item="l">
                            <li key={l.key} class="slds-m-bottom_x-small">
                                <a href={l.url} target="_blank" rel="noopener noreferrer">{l.title}</a>
                                <span class="slds-text-color_weak slds-m-left_x-small">{l.meta}</span>
                            </li>
                        </template>
                    </ul>
                </template>
                <div class="slds-m-top_medium">
                    <template lwc:if={canContinue}>
                        <lightning-button variant="brand" label="Continue practicing" onclick={continuePractice}
                            class="slds-m-right_x-small"></lightning-button>
                    </template>
                    <template lwc:if={fromHistory}>
                        <lightning-button label="Back to my progress" onclick={backToHistory}
                            class="slds-m-right_x-small"></lightning-button>
                    </template>
                    <lightning-button label="Start a new session" onclick={newSession}></lightning-button>
                </div>
                <div class="contrib-strip">
                    <lightning-button variant="base" label="Share a study resource" icon-name="utility:link"
                        data-kind="Study resource" onclick={openContribute} class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="base" label="Suggest an improvement" icon-name="utility:light_bulb"
                        data-kind="Suggestion" onclick={openContribute}></lightning-button>
                </div>
            </template>
            <!-- test result -->
            <template lwc:if={isTestResult}>
                <div class={resultBannerClass}>
                    <p class="slds-text-heading_large">{resultHeadline}</p>
                    <p>{resultDetail}</p>
                </div>
                <template lwc:if={testResult.incomplete}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium"><p>{incompleteNote}</p></div>
                </template>
                <p class="slds-text-color_weak slds-m-bottom_medium">{timeNote}</p>

                <p class="slds-text-title_caps slds-m-bottom_x-small">By section</p>
                <template for:each={testResult.domains} for:item="d">
                    <div key={d.key} class="area slds-m-bottom_small">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <span>{d.name} <span class="slds-text-color_weak">{d.weightText}</span></span>
                            <span>
                                <span class="slds-text-title_bold slds-m-right_x-small">{d.scoreText}</span>
                                <template lwc:if={d.verdict}><span class={d.verdictClass}>{d.verdict}</span></template>
                            </span>
                        </div>
                        <div class="bar"><div class="bar-fill" style={d.barStyle}></div></div>
                    </div>
                </template>

                <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">What to focus on next time</p>
                <ul class="slds-list_dotted slds-m-bottom_medium">
                    <template for:each={testResult.recommendations} for:item="r">
                        <li key={r.key}>{r.text}</li>
                    </template>
                </ul>

                <template lwc:if={hasResultMissed}>
                    <p class="slds-text-title_caps slds-m-bottom_x-small">Questions to review</p>
                    <template for:each={testResult.missed} for:item="m">
                        <details key={m.key} class="missed slds-m-bottom_x-small">
                            <summary>{m.stem}</summary>
                            <p class="slds-m-top_x-small"><strong>Correct:</strong> {m.correctAnswer}</p>
                            <p><strong>You chose:</strong> {m.yourAnswer}</p>
                            <template for:each={m.feedbackBlocks} for:item="b">
                                <p key={b.key} class="explanation slds-m-top_x-small">{b.text}</p>
                            </template>
                        </details>
                    </template>
                </template>
                <template lwc:if={hasTestLinks}>
                    <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Keep studying on Trailhead</p>
                    <ul class="study-links">
                        <template for:each={testResult.studyLinks} for:item="l">
                            <li key={l.key} class="slds-m-bottom_x-small">
                                <a href={l.url} target="_blank" rel="noopener noreferrer">{l.title}</a>
                                <span class="slds-text-color_weak slds-m-left_x-small">{l.meta}</span>
                            </li>
                        </template>
                    </ul>
                </template>
                <div class="slds-m-top_medium">
                    <template lwc:if={fromHistory}>
                        <lightning-button label="Back to my progress" onclick={backToHistory}
                            class="slds-m-right_x-small"></lightning-button>
                    </template>
                    <lightning-button variant="brand" label="Start something new" onclick={newSession}></lightning-button>
                </div>
                <div class="contrib-strip">
                    <lightning-button variant="base" label="Share a study resource" icon-name="utility:link"
                        data-kind="Study resource" onclick={openContribute} class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="base" label="Suggest an improvement" icon-name="utility:light_bulb"
                        data-kind="Suggestion" onclick={openContribute}></lightning-button>
                </div>
            </template>

            <!-- contribute: study resource or suggestion -->
            <template lwc:if={isContribute}>
                <template lwc:if={contribSent}>
                    <div class="slds-box slds-theme_success slds-m-bottom_medium">
                        <p class="slds-text-heading_small">Thanks! We got it.</p>
                        <p>An admin will review it, usually within 2 business days.</p>
                    </div>
                    <lightning-button variant="brand" label="Done" onclick={closeContribute}
                        class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Send another" onclick={resetContributeForm}></lightning-button>
                </template>
                <template lwc:else>
                    <p class="slds-text-heading_medium">{contribHeading}</p>
                    <p class="slds-text-color_weak slds-m-bottom_small">{contribHelp}</p>
                    <lightning-radio-group name="contribKind" label="What are you sending?" options={contribKindOptions}
                        value={contribKind} onchange={changeContribKind} type="button"></lightning-radio-group>
                    <template lwc:if={contribIsResource}>
                        <lightning-combobox name="contribCert" label="Certification" value={contribCert}
                            options={contribCertOptions} placeholder="Choose a certification" onchange={changeContribCert}
                            required class="slds-m-top_small"></lightning-combobox>
                        <lightning-input name="contribTitle" label="Title" value={contribTitle} maxlength="150"
                            placeholder="e.g. Official exam guide, my notes on Flows" onchange={changeContribTitle}></lightning-input>
                        <lightning-input name="contribUrl" type="url" label="Link (optional if you paste text)" value={contribUrl}
                            placeholder="https://..." onchange={changeContribUrl}></lightning-input>
                        <lightning-textarea name="contribDetails" label="Text or notes (optional if you add a link)"
                            value={contribDetails} maxlength="20000" onchange={changeContribDetails}></lightning-textarea>
                        <p class="slds-text-color_weak slds-text-body_small">Links to hosted files (Drive, Quip, Slack canvases) are fine; make sure reviewers can open them. No uploads.</p>
                    </template>
                    <template lwc:else>
                        <lightning-input name="contribTitle" label="Short summary (optional)" value={contribTitle}
                            maxlength="150" onchange={changeContribTitle} class="slds-m-top_small"></lightning-input>
                        <lightning-textarea name="contribDetails" label="Your suggestion" value={contribDetails}
                            maxlength="20000" onchange={changeContribDetails} required></lightning-textarea>
                    </template>
                    <template lwc:if={contribError}>
                        <p class="slds-text-color_error slds-m-top_x-small">{contribError}</p>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button variant="brand" label="Send for review" onclick={sendContribution}
                            disabled={contribSending} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Cancel" onclick={closeContribute}></lightning-button>
                    </div>
                </template>
            </template>

            <!-- what's new (release log) -->
            <template lwc:if={isWhatsNew}>
                <p class="slds-text-heading_medium slds-m-bottom_small">What's new</p>
                <template lwc:if={hasUpcoming}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium upcoming">
                        <p class="slds-text-title_caps slds-m-bottom_x-small">Coming soon</p>
                        <p class="slds-text-color_weak slds-m-bottom_x-small">What we're working on next. Plans can change.</p>
                        <ul class="slds-list_dotted">
                            <template for:each={upcoming} for:item="u">
                                <li key={u.key}>{u.text}</li>
                            </template>
                        </ul>
                    </div>
                </template>
                <p class="slds-text-title_caps slds-m-bottom_x-small">Release history</p>
                <template for:each={releases} for:item="r">
                    <div key={r.version} class="release">
                        <div class="release-head">
                            <span class="release-version">{r.version}</span>
                            <span class="slds-text-color_weak">{r.date}</span>
                            <template lwc:if={r.isCurrent}>
                                <span class="slds-badge slds-badge_inverse slds-m-left_x-small">Current</span>
                            </template>
                        </div>
                        <ul class="slds-list_dotted">
                            <template for:each={r.lines} for:item="l">
                                <li key={l.key}>{l.text}</li>
                            </template>
                        </ul>
                    </div>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button label="Back" onclick={closeWhatsNew}></lightning-button>
                </div>
            </template>

            <!-- suggested next certs -->
            <template lwc:if={isRecs}>
                <p class="slds-text-heading_medium">Suggested next certifications</p>
                <p class="slds-text-color_weak slds-m-bottom_medium">{recsSubline}</p>
                <template lwc:if={hasRecs}>
                    <template for:each={recs} for:item="r">
                        <div key={r.key} class="rec-card">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <div class="slds-col">
                                    <div class="rec-name">{r.name}
                                        <template lwc:if={r.isBroaden}>
                                            <span class="slds-badge slds-m-left_x-small">Broaden your skills</span>
                                        </template>
                                    </div>
                                    <div class="rec-reason">{r.reason}</div>
                                </div>
                                <div class="slds-col slds-grow-none">
                                    <lightning-button variant="brand" label="Practice this" data-code={r.code}
                                        onclick={practiceRec} class="slds-m-right_x-small"></lightning-button>
                                    <lightning-button variant="base" label="I already have this" data-code={r.code}
                                        onclick={recAlreadyHave}></lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <p>No suggestions right now. You may already hold most of what is available.</p>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button label="Back to certifications" onclick={showSelect}></lightning-button>
                </div>
            </template>

            <!-- progress history -->
            <template lwc:if={isHistory}>
                <p class="slds-text-heading_medium">{historyHeadline}</p>
                <p class="slds-text-color_weak slds-m-bottom_medium">{historySubline}</p>

                <template lwc:if={hasWeakAreas}>
                    <p class="slds-text-title_caps slds-m-bottom_x-small">Weakest areas across all sessions</p>
                    <template for:each={history.weakAreas} for:item="a">
                        <div key={a.key} class="area slds-m-bottom_x-small">
                            <div class="slds-grid slds-grid_align-spread">
                                <span>{a.label}</span>
                                <span class="slds-text-title_bold">{a.pct}% ({a.correct}/{a.total})</span>
                            </div>
                            <div class="bar"><div class="bar-fill" style={a.barStyle}></div></div>
                        </div>
                    </template>
                </template>

                <template lwc:if={hasSuggestedLinks}>
                    <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Trailhead suggestions so far</p>
                    <ul class="study-links">
                        <template for:each={history.suggestedLinks} for:item="l">
                            <li key={l.key} class="slds-m-bottom_x-small">
                                <a href={l.url} target="_blank" rel="noopener noreferrer">{l.title}</a>
                                <span class="slds-text-color_weak slds-m-left_x-small">{l.meta}</span>
                                <template lwc:if={l.lastText}><span class="slds-text-color_weak slds-m-left_x-small">· {l.lastText}</span></template>
                            </li>
                        </template>
                    </ul>
                </template>

                <template lwc:if={hasHistorySessions}>
                    <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Sessions and tests</p>
                    <template for:each={history.sessions} for:item="x">
                        <div key={x.id} class="history-row slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                            <div class="slds-col slds-size_3-of-12 slds-text-color_weak">{x.when}</div>
                            <div class="slds-col slds-size_1-of-12">{x.modeLabel}</div>
                            <div class="slds-col slds-size_4-of-12 slds-truncate" title={x.certNames}>{x.certNames}</div>
                            <div class="slds-col slds-size_2-of-12">
                                {x.scoreText}
                                <template lwc:if={x.badge}><span class={x.badgeClass}>{x.badge}</span></template>
                            </div>
                            <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                                <template lwc:if={x.canOpen}>
                                    <lightning-button variant="base" label="View" data-id={x.id}
                                        onclick={openPastSession}></lightning-button>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" label="Start practicing" onclick={newSession}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
    <div class="brand-footer">
        <div>
            Cert Study {appVersion} &middot; {releasedOn} &middot; Built by {ownerName} &middot;
            <a href={ownerMailto}>{ownerEmail}</a>
        </div>
        <div>
            Internal pilot. Practice questions are AI-generated from study materials and are not official
            Salesforce exam content.
        </div>
    </div>
</template>
